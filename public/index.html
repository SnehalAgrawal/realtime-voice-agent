<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat UI</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2em auto; padding: 1em; }
    #chat { border: 1px solid #ccc; border-radius: 4px; padding: 1em; height: 400px; overflow-y: auto; }
    .message { margin: 0.5em 0; }
    .user { color: blue; }
    .bot { color: green; }
    #inputForm { display: flex; margin-top: 1em; }
    #messageInput { flex: 1; padding: 0.5em; font-size: 1em; }
    #inputForm button { padding: 0.5em 1em; font-size: 1em; margin-left: 0.5em; }
    #time { margin-top: 1em; color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Chat with Bot</h1>
  <div id="chat"></div>
  <form id="inputForm">
    <input id="messageInput" type="text" placeholder="Type your message..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>
  <div id="time"></div>
  <script>
    const chatEl = document.getElementById('chat');
    const formEl = document.getElementById('inputForm');
    const inputEl = document.getElementById('messageInput');
    const timeEl = document.getElementById('time');

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.classList.add('message', sender);
      div.textContent = sender === 'user' ? 'You: ' + text : 'Bot: ' + text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = inputEl.value.trim();
      if (!msg) return;
      appendMessage(msg, 'user');
      inputEl.value = '';
      timeEl.textContent = '';
      appendMessage('...', 'bot');
      const placeholder = chatEl.lastChild;
      const start = Date.now();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        if (!res.ok) {
          const err = await res.text();
          placeholder.textContent = 'Bot: Error: ' + err;
          return;
        }
        const data = await res.json();
        placeholder.textContent = 'Bot: ' + data.response;
        timeEl.textContent = `Response time: ${data.timeMs} ms`;
      } catch (err) {
        placeholder.textContent = 'Bot: Network error';
        console.error(err);
      }
    });
  </script>
</body>
</html>
